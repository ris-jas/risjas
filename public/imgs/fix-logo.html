<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            width: 512px;
            height: 512px;
        }
        .container {
            width: 512px;
            height: 512px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="Logo.png" />
    </div>
</body>
</html>
